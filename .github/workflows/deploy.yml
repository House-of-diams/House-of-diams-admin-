name: Deploy Admin UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-uat-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript and authentication regressions
        run: |
          set -euo pipefail
          pnpm typecheck
          python3 scripts/test-admin-release-cleanup.py
          node --test scripts/test-admin-ci-packaging.mjs
          node node_modules/eslint/bin/eslint.js lib/auth/request-security.ts lib/auth/handlers.ts scripts/build-admin-uat.mjs scripts/package-admin-uat.mjs scripts/test-admin-ci-packaging.mjs
          node --import ./scripts/offline-network-guard.mjs --conditions=react-server --test scripts/test-admin-oidc.mjs scripts/test-admin-images.mjs
      - name: Build once on GitHub
        run: node scripts/build-admin-uat.mjs
      - name: Package built release
        run: |
          set -euo pipefail
          node scripts/prune-admin-ci-dependencies.mjs
          node scripts/package-admin-uat.mjs "$RUNNER_TEMP/admin-runtime"
          name="admin-release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/admin-runtime" .
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")
      - name: Configure verified SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ADMIN_UAT_SSH_KEY }}
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_HOST" && test -n "$SSH_USER"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_HOST" != -* ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/admin_uat_key"
          chmod 600 "$HOME/.ssh/admin_uat_key"
          ssh-keyscan -T 15 -t ed25519 "$SSH_HOST" > "$RUNNER_TEMP/scanned-host-key" 2>/dev/null
          pinned="$(awk '{print $2}' config/admin-uat-ssh-hostkey.pub)"
          awk -v pinned="$pinned" '$2 == "ssh-ed25519" && $3 == pinned {print}' "$RUNNER_TEMP/scanned-host-key" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'EC2 SSH host key does not match the SSM-verified key'; exit 1; }
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload and activate built artifact
        env:
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail
          name="admin-release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          ssh -o StrictHostKeyChecking=yes -i "$HOME/.ssh/admin_uat_key" "$SSH_USER@$SSH_HOST" \
            "python3 -" < scripts/cleanup-admin-uat.py
          bytes=$(( $(du -sk "$RUNNER_TEMP/admin-runtime" | cut -f1) * 1024 ))
          entries=$(find "$RUNNER_TEMP/admin-runtime" | wc -l | tr -d ' ')
          ssh -o StrictHostKeyChecking=yes -i "$HOME/.ssh/admin_uat_key" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$bytes' '$entries'" < scripts/check-admin-uat-capacity.sh
          scp -o StrictHostKeyChecking=yes -i "$HOME/.ssh/admin_uat_key" "$RUNNER_TEMP/$name" "$RUNNER_TEMP/$name.sha256" "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -o StrictHostKeyChecking=yes -i "$HOME/.ssh/admin_uat_key" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$GITHUB_SHA' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" < scripts/deploy-admin-uat-artifact.sh
      - name: Retain active and rollback releases and clean failed uploads
        if: always()
        env:
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail
          if test -f "$HOME/.ssh/admin_uat_key" && test -s "$HOME/.ssh/known_hosts"; then
            ssh -o StrictHostKeyChecking=yes -i "$HOME/.ssh/admin_uat_key" "$SSH_USER@$SSH_HOST" \
              "python3 -" < scripts/cleanup-admin-uat.py
          fi
      - name: Remove temporary SSH key
        if: always()
        run: rm -f -- "$HOME/.ssh/admin_uat_key"
