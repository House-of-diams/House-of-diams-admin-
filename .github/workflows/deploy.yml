
name: Deploy Admin UAT

on:
  push:
    branches:
name: Deploy Admin UAT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-uat-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Admin UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source package
        run: |
          set -euo pipefail

          test -f package.json
          test -f pnpm-lock.yaml

          mkdir -p "$RUNNER_TEMP/admin-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/admin-source"

          rm -rf "$RUNNER_TEMP/admin-source/.next"
          rm -rf "$RUNNER_TEMP/admin-source/node_modules"
          rm -f "$RUNNER_TEMP/admin-source/config/admin-uat-aws.env"

          tar -czf "$RUNNER_TEMP/admin-release.tar.gz" \
            -C "$RUNNER_TEMP/admin-source" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ADMIN_UAT_SSH_KEY }}
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "Missing ADMIN_UAT_SSH_KEY secret"
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "Missing ADMIN_UAT_HOST secret"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/admin_uat_key"
          chmod 600 "$HOME/.ssh/admin_uat_key"

          # For stronger security, pin a host key verified independently.
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload source package
        env:
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"

          scp -i "$HOME/.ssh/admin_uat_key" \
            "$RUNNER_TEMP/admin-release.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/admin-release-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"

      - name: Build and activate Admin UAT release
        env:
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/admin_uat_key" \
            "$SSH_USER@$SSH_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          SERVICE="hod-admin-uat.service"
          DROPIN="/etc/systemd/system/hod-admin-uat.service.d/release.conf"
          RELEASE="/opt/hod-admin/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ARCHIVE="/tmp/admin-release-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"

          # Find the active release.
          PREVIOUS="$(systemctl show "$SERVICE" -p WorkingDirectory --value)"

          test -n "$PREVIOUS"
          test -f "$PREVIOUS/config/admin-uat-aws.env"
          test -f "$ARCHIVE"

          # Never overwrite or reuse an existing release.
          if [ "$RELEASE" = "$PREVIOUS" ] || [ -e "$RELEASE" ]; then
            echo "ERROR: Release directory already exists or is active: $RELEASE"
            exit 1
          fi

          # Prepare the new release.
          install -d -o root -g root -m 755 "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"

          # Preserve the active UAT configuration.
          install -d -o hod-admin -g hod-admin -m 755 "$RELEASE/config"
          cp "$PREVIOUS/config/admin-uat-aws.env" \
            "$RELEASE/config/admin-uat-aws.env"

          chown -R hod-admin:hod-admin "$RELEASE"

          # Confirm Node.js and Corepack are available.
          test -x /opt/node-v24/bin/node
          test -x /opt/node-v24/bin/corepack

          # Install locked dependencies and build on EC2.
          runuser -u hod-admin -- env \
            HOME=/var/lib/hod-admin \
            PATH=/opt/node-v24/bin:/usr/local/bin:/usr/bin:/bin \
            bash -c "
              set -e
              cd '$RELEASE'
              corepack pnpm install --frozen-lockfile
              corepack pnpm run build
            "

          # Activate only after the build succeeds.
          install -d -o root -g root -m 755 "$(dirname "$DROPIN")"
          printf '[Service]\nWorkingDirectory=%s\n' "$RELEASE" > "$DROPIN"
          systemctl daemon-reload

          if ! systemctl restart "$SERVICE"; then
            echo "Service restart failed; restoring previous release."
            printf '[Service]\nWorkingDirectory=%s\n' "$PREVIOUS" > "$DROPIN"
            systemctl daemon-reload
            systemctl restart "$SERVICE" || true
            exit 1
          fi

          # Check the Admin UAT login endpoint.
          for attempt in $(seq 1 12); do
            if curl --fail --silent \
              http://127.0.0.1:3101/login >/dev/null; then
              echo "Admin UAT health check passed."
              rm -f "$ARCHIVE"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed; restoring previous release."
          printf '[Service]\nWorkingDirectory=%s\n' "$PREVIOUS" > "$DROPIN"
          systemctl daemon-reload
          systemctl restart "$SERVICE" || true
          exit 1
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/admin_uat_key"

      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-uat-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Admin UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source package
        run: |
          set -euo pipefail

          test -f package.json
          test -f pnpm-lock.yaml

          mkdir -p "$RUNNER_TEMP/admin-source"

          git archive HEAD | tar -x -C "$RUNNER_TEMP/admin-source"

          rm -rf "$RUNNER_TEMP/admin-source/.git"
          rm -rf "$RUNNER_TEMP/admin-source/.next"
          rm -rf "$RUNNER_TEMP/admin-source/node_modules"
          rm -f "$RUNNER_TEMP/admin-source/config/admin-uat-aws.env"

          tar -czf "$RUNNER_TEMP/admin-release.tar.gz" \
            -C "$RUNNER_TEMP/admin-source" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ADMIN_UAT_SSH_KEY }}
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "Missing ADMIN_UAT_SSH_KEY secret"
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "Missing ADMIN_UAT_HOST secret"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/admin_uat_key"
          chmod 600 "$HOME/.ssh/admin_uat_key"

          # Obtain the host key. For stronger protection, pin a key
          # verified through a trusted channel instead of trusting this scan.
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload source package
        env:
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"

          scp -i "$HOME/.ssh/admin_uat_key" \
            "$RUNNER_TEMP/admin-release.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/admin-release-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"

      - name: Build and activate Admin UAT release
        env:
          SSH_HOST: ${{ secrets.ADMIN_UAT_HOST }}
          SSH_USER: ${{ secrets.ADMIN_UAT_USER }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/admin_uat_key" \
            "$SSH_USER@$SSH_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          SERVICE="hod-admin-uat.service"
          DROPIN="/etc/systemd/system/hod-admin-uat.service.d/release.conf"
          RELEASE="/opt/hod-admin/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ARCHIVE="/tmp/admin-release-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"

          # Find the currently active release and preserve its UAT config.
          PREVIOUS="$(systemctl show "$SERVICE" -p WorkingDirectory --value)"
          test -n "$PREVIOUS"
          test -f "$PREVIOUS/config/admin-uat-aws.env"
          test -f "$ARCHIVE"

          install -d -o root -g root -m 755 "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"

          install -d -o hod-admin -g hod-admin -m 755 "$RELEASE/config"
          cp -a "$PREVIOUS/config/admin-uat-aws.env" \
            "$RELEASE/config/admin-uat-aws.env"

          chown -R hod-admin:hod-admin "$RELEASE"

          # Ensure pnpm is available through Corepack.
          command -v /opt/node-v24/bin/node
          command -v /opt/node-v24/bin/corepack

          # Install locked dependencies and build as the service user.
          runuser -u hod-admin -- env \
            HOME=/var/lib/hod-admin \
            PATH=/opt/node-v24/bin:/usr/local/bin:/usr/bin:/bin \
            bash -c "
              set -e
              cd '$RELEASE'
              corepack pnpm install --frozen-lockfile
              corepack pnpm run build
            "

          # Activate only after the new release builds successfully.
          install -d -o root -g root -m 755 "$(dirname "$DROPIN")"
          printf '[Service]\nWorkingDirectory=%s\n' "$RELEASE" > "$DROPIN"
          systemctl daemon-reload

          if ! systemctl restart "$SERVICE"; then
            echo "Service restart failed; restoring previous release."
            printf '[Service]\nWorkingDirectory=%s\n' "$PREVIOUS" > "$DROPIN"
            systemctl daemon-reload
            systemctl restart "$SERVICE" || true
            exit 1
          fi

          # Check the local Admin UAT login endpoint.
          for attempt in $(seq 1 12); do
            if curl --fail --silent \
              http://127.0.0.1:3101/login >/dev/null; then
              echo "Admin UAT health check passed."
              rm -f "$ARCHIVE"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed; restoring previous release."
          printf '[Service]\nWorkingDirectory=%s\n' "$PREVIOUS" > "$DROPIN"
          systemctl daemon-reload
          systemctl restart "$SERVICE" || true
          exit 1
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/admin_uat_key"
